# Dependabot keeps dependencies and GitHub Actions up to date.
#
# Updates are proposed as PRs only — they never merge automatically — so peer-range
# and major-bump decisions are always made by a human before anything lands.
version: 2

updates:
  # npm devDependencies and peerDependencies. Production `dependencies` is empty by
  # design (zero direct deps), so this effectively tracks tooling and peer ranges.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # ORDER MATTERS: a dependency joins only the FIRST group whose conditions it
      # matches, so any narrower group must precede the catch-all below.

      # The commitlint CLI and its shared config are released in lockstep and are
      # only compatible pairwise. Split across two PRs, merging either one alone
      # leaves a mismatched pair that breaks the `commit-msg` hook for every
      # contributor — locally, where no CI check ever runs it. Grouping all update
      # types (major included) keeps them in one reviewable change.
      commitlint:
        patterns:
          - '@commitlint/*'
        update-types:
          - major
          - minor
          - patch

      # BullMQ and ioredis are one type graph, not two packages. BullMQ's
      # `ConnectionOptions` accepts an ioredis `Redis`, and that assignment only
      # typechecks while a single copy of ioredis resolves in the tree. Bump one
      # without the other and the copies diverge:
      #
      #   error TS2322: Type 'Redis' is not assignable to type 'ConnectionOptions'
      #
      # on every site that hands a client to a Queue, Worker, QueueEvents or
      # FlowProducer, while the very same versions applied together typecheck
      # cleanly. Grouping all update types keeps them moving as the pair they are.
      # The workspace `overrides` in pnpm-workspace.yaml enforce the other half of
      # the invariant: one resolved copy across the root and every example.
      bullmq-stack:
        patterns:
          - 'bullmq'
          - 'bullmq-otel'
          - 'ioredis'
        update-types:
          - major
          - minor
          - patch

      # The NestJS runtime packages are one release train, not independent packages.
      # `@nestjs/core` deep-imports internals of `@nestjs/common` while declaring a
      # peer range of `^11.0.0` on it, so the range does not describe the real
      # coupling and nothing rejects a mismatched pair at install time. Bumped one
      # at a time, the lockfile resolves a tree where core is ahead of common and
      # every suite that builds a Nest testing module dies at require time:
      #
      #   Cannot find module '@nestjs/common/decorators/http/sse-signal.decorator'
      #   from '.../@nestjs+core@11.2.1_@nestjs+common@11.1.29_.../
      #         node_modules/@nestjs/core/router/router-execution-context.js'
      #
      # while the same versions applied together pass. The pattern is unscoped by
      # `dependency-type` on purpose: `@nestjs/platform-fastify` is a production
      # dependency of the consumer app under `test/`, so the development-only
      # catch-all below never covered it and it shipped in its own PR. Majors stay
      # excluded here and remain governed by the `ignore` rules further down, which
      # keep a peer-range widening a deliberate decision.
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch

      # Batch low-risk dev tooling bumps into a single PR to cut review noise.
      # Majors stay out: each one needs its own verification and its own revert.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Peer dependencies define the supported consumer range — bumping them is a
      # breaking-change decision made deliberately, not by an automated minor bump.
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      - dependency-name: bullmq
        update-types: [version-update:semver-major]
      - dependency-name: bullmq-otel
        update-types: [version-update:semver-major]
      - dependency-name: ioredis
        update-types: [version-update:semver-major]
      - dependency-name: reflect-metadata
        update-types: [version-update:semver-major]
      # TypeScript 6 and ESLint 10 are known to break the lint/typecheck gate and
      # are intentionally held back until revisited.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # `@types/node` majors track the Node release line. `engines` declares
      # `>=24`, so typechecking against a newer major would let code compile
      # against APIs absent from the oldest runtime this package claims to
      # support. Raise the floor in `engines` first, then lift this hold.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # The workflow actions themselves (checkout, setup-node, pnpm, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      # The CodeQL sub-actions are one product with one version. `init` writes a config
      # that `analyze` reads back, and the reader refuses a config written by a
      # different version:
      #
      #   Loaded a configuration file for version '<older>', but running version '<newer>'
      #
      # Bumped one at a time — which is what Dependabot does by default, since each
      # sub-action is a separate action reference — merging one leaves the default branch
      # mismatched until its siblings land, and CodeQL runs on push to main. Which
      # sub-actions a repository uses varies (`upload-sarif` lives in scorecard.yml, and
      # `autobuild` only where the analysis needs it), so the pattern covers them all
      # rather than naming a count. Grouping every update type keeps the set in a single
      # reviewable change that is consistent by construction.
      codeql:
        patterns:
          - 'github/codeql-action/*'
        update-types:
          - major
          - minor
          - patch
