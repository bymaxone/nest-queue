# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (lint, typecheck, unit+coverage, mutation) run via
# node-lib-ci.yml so every repo shares one definition. This library's build +
# bundle-size budget, its Testcontainers Redis e2e, the in-repo example build,
# and a verified-secret scan stay here (repo-specific). Mutation runs only on a
# push to main / manual dispatch, never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: false # no format:check script; prettier runs via lint/pre-commit
      run-build: false # build + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'

  verify:
    # The job name is the status-check context required by the repository
    # ruleset (`nest-queue-pr-and-ci-gates`). Renaming it silently blocks every
    # PR — the required context stops reporting and merges wait forever. Add
    # steps here freely; change this string only together with the ruleset.
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Type-level API tests
        # Compiles test/types/ against src/, pinning the published signatures so
        # a refactor that widens or loosens one fails here rather than silently.
        run: pnpm test:types
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        # Confirms every declared subpath produced both ESM and CJS bundles plus
        # declarations in both formats. A missing artifact indicates a tsup
        # misconfiguration that would ship a broken package to npm — and the
        # `.d.cts` files in particular are what the `exports` map hands to a
        # CommonJS consumer.
        run: |
          for subpath in server shared; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath/index.$ext" ]; then
                echo "Missing dist/$subpath/index.$ext"
                exit 1
              fi
            done
          done
          echo "Both subpaths produced ESM + CJS + .d.ts + .d.cts"
      - name: Verify published type resolution
        # The type-level API tests compile `src`, so they cannot catch a broken
        # `exports` map: a consumer resolving the package through the packed
        # tarball may still land on declarations for the wrong module format.
        # `attw` packs the tarball and resolves every entrypoint the way each
        # module resolution mode would.
        run: pnpm check:exports
      - name: Bundle size budget
        run: pnpm size

  e2e:
    name: E2E (Testcontainers + Redis)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Pre-pull pinned Redis image (cache for Testcontainers)
        run: docker pull redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
      - name: E2E tests
        run: pnpm test:e2e

  consumer-app:
    name: Consumer app typecheck
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Build library
        run: pnpm build
      - name: Typecheck the consumer app
        # Compiles application-shaped code — a decorated @Processor class, a module
        # wired through forRootAsync, a controller — against the FRESHLY BUILT
        # library, resolved through the `exports` map exactly as a consumer would.
        # This is the only gate that catches an ergonomic break in the decorator
        # API: `test:types` compiles against `src` via `paths`, and the dogfood
        # smoke test only checks runtime resolution.
        run: pnpm --filter nest-queue-consumer-app build
      - name: Lint the consumer app
        run: pnpm --filter nest-queue-consumer-app lint

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified

  security:
    # Dependency review needs the dependency graph (public repos, or private + GHAS).
    # Gated on visibility so it starts running automatically once this repo is public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high
