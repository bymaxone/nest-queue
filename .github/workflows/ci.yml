# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (lint, typecheck, unit+coverage, mutation) run via
# node-lib-ci.yml so every repo shares one definition. This library's build +
# bundle-size budget, its Testcontainers Redis e2e, the in-repo example build,
# and a verified-secret scan stay here (repo-specific). Mutation runs only on a
# push to main / manual dispatch, never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: false # no format:check script; prettier runs via lint/pre-commit
      run-build: false # build + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'
      # The per-push run is incremental and finishes in minutes; this ceiling exists for the
      # cold one — the first run after enabling incremental, and any run whose baseline cache
      # expired. Measured cold: 7 min. The job is CANCELLED rather than failed when it
      # lands, which reads as an infrastructure blip instead of a budget.
      mutation-timeout-minutes: 45

  verify:
    # The job name is the status-check context required by the repository
    # ruleset (`nest-queue-pr-and-ci-gates`). Renaming it silently blocks every
    # PR — the required context stops reporting and merges wait forever. Add
    # steps here freely; change this string only together with the ruleset.
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check:published` cross-checks every release tag against a CHANGELOG
          # section. The default checkout is shallow and carries no tags, so the
          # check would find nothing and pass — the silent no-op it exists to
          # prevent. The script also fetches tags itself; this makes it explicit
          # rather than dependent on the runner having credentials to do so.
          fetch-depth: 0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Type-level API tests
        # Compiles test/types/ against src/, pinning the published signatures so
        # a refactor that widens or loosens one fails here rather than silently.
        run: pnpm test:types
      - name: Mutation directives parse and carry their reason
        run: pnpm check:mutants
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        # Confirms every declared subpath produced both ESM and CJS bundles plus
        # declarations in both formats. A missing artifact indicates a tsup
        # misconfiguration that would ship a broken package to npm — and the
        # `.d.cts` files in particular are what the `exports` map hands to a
        # CommonJS consumer.
        run: |
          for subpath in server shared; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath/index.$ext" ]; then
                echo "Missing dist/$subpath/index.$ext"
                exit 1
              fi
            done
          done
          echo "Both subpaths produced ESM + CJS + .d.ts + .d.cts"
      - name: Verify published type resolution
        # The type-level API tests compile `src`, so they cannot catch a broken
        # `exports` map: a consumer resolving the package through the packed
        # tarball may still land on declarations for the wrong module format.
        # `attw` packs the tarball and resolves every entrypoint the way each
        # module resolution mode would.
        run: pnpm check:exports
      - name: Verify the published surface matches the documentation
        # Three checks that each exist because a defect reached npm without them:
        # the README's links resolve; its TypeScript snippets and the type tests
        # compile against `dist/` resolved through the `exports` map (`test:types`
        # maps the package to `./src`, so it cannot see a divergence between the
        # source and the shipped `.d.ts`); and every `v*.*.*` tag has a CHANGELOG
        # section, the tags being the outside source of truth a file cannot
        # contradict about itself.
        run: pnpm check:published
      - name: Bundle size budget
        run: pnpm size

  e2e:
    name: E2E (Testcontainers + Redis)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Pre-pull pinned Redis image (cache for Testcontainers)
        run: docker pull redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
      - name: E2E tests
        run: pnpm test:e2e

  consumer-app:
    name: Consumer app typecheck
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Build library
        run: pnpm build
      - name: Typecheck the consumer app
        # Compiles application-shaped code — a decorated @Processor class, a module
        # wired through forRootAsync, a controller — against the FRESHLY BUILT
        # library, resolved through the `exports` map exactly as a consumer would.
        # This is the only gate that catches an ergonomic break in the decorator
        # API: `test:types` compiles against `src` via `paths`, and the dogfood
        # smoke test only checks runtime resolution.
        run: pnpm --filter nest-queue-consumer-app build
      - name: Lint the consumer app
        run: pnpm --filter nest-queue-consumer-app lint

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --only-verified

  security:
    # Dependency review needs the dependency graph (public repos, or private + GHAS).
    # Gated on visibility so it starts running automatically once this repo is public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral — the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, verify, e2e, consumer-app, secret-scan, security]
    runs-on: ubuntu-latest
    # Once this is the required check, a hung runner holds every merge behind it
    # for GitHub's default of six hours. The job is one comparison, so a short
    # ceiling costs nothing and bounds that.
    timeout-minutes: 5
    steps:
      # Printed on success as well as failure. Without it the check reports a bare
      # red X and the reader has to open each dependency to find which one broke.
      - name: Report the result of every dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Named for what the condition does: `skipped` is deliberately not a failure
      # here, so "did not succeed" would describe a stricter gate than this is.
      - name: Fail when any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
