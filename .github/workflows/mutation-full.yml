# The full cold mutation run. The logic lives once in `bymaxone/.github`; what stays here is
# what is genuinely local: when it runs and how long it may take.
#
# Why it exists: `stryker.config.json` sets `incremental: true`, so the per-push job re-tests
# only what changed and finishes inside the minutes a routine gate is allowed to take. That is a
# trade — an incremental run reuses stored verdicts, and reused verdicts for STATIC mutants can
# be stale. The fast signal is here every push; the truth is measured cold, once a week.
name: Mutation (full)

on:
  schedule:
    # Off the working day, and staggered against the other libraries so a Monday morning does
    # not start ten cold suites at once.
    - cron: '13 4 * * 1'
  workflow_dispatch:

# Single-flight across the whole repository, deliberately NOT keyed by `github.ref`
# — the same reasoning `peer-advisory-drift.yml` here already carries. What two runs
# would race over is one shared incremental baseline, so a ref-scoped group would put
# a dispatch and the scheduled run in different groups and leave the race intact.
# Queue rather than cancel: a cold run killed halfway leaves no baseline at all,
# which is worse than a second run waiting for the first.
concurrency:
  group: mutation-full
  cancel-in-progress: false

permissions:
  contents: read
  # The reusable reads `gh run list` to decide whether anything can have moved the score.
  actions: read

jobs:
  full:
    uses: bymaxone/.github/.github/workflows/mutation-full.yml@v1
    with:
      # The ceiling is per shard job, and a cancelled run leaves no score and no baseline for the
      # week, so it is sized from a measurement and kept well clear of the heaviest shard. One cold
      # run on 99734c9 (run 45285656883) measured, per shard, the dry-run time of the shard's tests
      # and the static mutants Stryker detected, and shard 1 ran to the end:
      #   shard  mutants  static  dry run (net)  result
      #   1        151   not flagged   4.9 s     finished, 824 s of mutation (10.9 s per mutant per worker)
      #   2        691      133        7.8 s     cut off at the ceiling
      #   3        848      161        9.7 s     cut off at the ceiling
      #   4        927      348       10.6 s     cut off at the ceiling
      # A static mutant runs the whole shard suite. Shard 1's 10.9 s per mutant per worker is 2.2
      # times its net dry-run time, and that ratio is taken as the cost of one static mutant in
      # every shard. A shard is therefore estimated as
      # (static x net x 2.2 + other mutants x 3.9 s) / 2 workers, where 3.9 s is the per-mutant
      # average of the previous cold run (917 s, 2 workers, about 465 mutants a shard): about 37,
      # 51 and 86 minutes for shards 2, 3 and 4. The ceiling is 1.5 times the slowest, rounded up.
      # The cut-off shards give only a lower bound (they ran past 23 minutes), so re-measure from the
      # job durations of the next scored run and tighten it then.
      timeout-minutes: 130
      # A unit test the cold run did not run fails the job: it would never be held to killing a
      # mutant, and the score cannot notice. The tooling specs that reach no source are listed in
      # scripts/mutation-inventory.exempt.json.
      inventory: enforce
      # Four shards of two workers each. A worker grows to several GiB over a long run, so the workers
      # of one shard must fit one runner. The count and the concurrency are passed here, not written
      # into stryker.config.json, which the per-push incremental job and local runs share.
      shards: 4
      concurrency: 2
