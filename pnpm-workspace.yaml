packages:
  - '.'
  - 'examples/*'

verifyDepsBeforeRun: false
onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - unrs-resolver
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: since pnpm 11 the `pnpm` field of package.json is ignored
# outright, with no warning, so an override placed there silently does nothing.
overrides:
  'brace-expansion': '^5.0.8'
  'esbuild': '^0.28.1'
  'fast-uri': '^3.1.4'
  'find-my-way': '^9.6.1'
  'js-yaml@3': '^3.15.0'
  'js-yaml@4': '^4.3.0'
  'protobufjs': '^7.6.5'
  'qs': '^6.15.2'
