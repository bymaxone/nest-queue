packages:
  - '.'
  - 'test/consumer-app'

verifyDepsBeforeRun: false
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. An unlisted package counts as unreviewed and its scripts are denied.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Forced versions, for two distinct reasons. These live here and NOT in
# package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so an
# override placed there does nothing — it warns, but it does nothing.
#
# 1. `bullmq` and `ioredis` are collapsed to ONE copy across the workspace. BullMQ's
#    `ConnectionOptions` accepts an ioredis `Redis`, and that assignment typechecks
#    only while a single copy of ioredis resolves. Left alone, the example workspace
#    kept its own older pair and its build failed with `Type 'Redis' is missing the
#    following properties from type 'Redis'` — two structurally identical types from
#    two copies. The root and every example must agree, so the version is forced
#    rather than left to each manifest's range.
# 2. Everything below is a vulnerable transitive dev dependency.
overrides:
  'bullmq': '5.81.2'
  'ioredis': '5.11.1'
  # Scoped per major, like the js-yaml and undici pairs: unscoped, a 1.x or 2.x
  # transitive would be forced onto 5.x, whose API minimatch cannot use. Each
  # line carries its own fix for the DoS that bypasses the earlier mitigation.
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'
  'esbuild': '^0.28.1'
  'fast-uri': '^3.1.5'
  'find-my-way': '^9.6.1'
  'js-yaml@3': '^3.15.0'
  'js-yaml@4': '^4.3.0'
  'protobufjs': '^7.6.5'
  'qs': '^6.15.2'
  # Scoped by major, like the js-yaml pair above: unscoped, a future transitive on
  # undici 7.x would be forced onto 8.x. The advisories cover both lines —
  # `>=7.0.0 <7.29.0` and `>=8.0.0 <8.9.0` — so each is pinned to its own fix, and
  # a 7.x arriving later lands above the floor rather than below it.
  'undici@7': '^7.29.0'
  'undici@8': '^8.9.0'
